name: Evidence Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate EO evidence schema
        run: python scripts/validate_evidence.py
