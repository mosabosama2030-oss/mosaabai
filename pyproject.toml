[project]
name = "mosaabai"
version = "0.1.0"
description = "Sovereign Cognitive Agent OS / Agent Factory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "structlog>=24.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "core",
    "cognition", "cognition.reasoning", "cognition.planning",
    "cognition.strategies", "cognition.world_model",
    "language", "language.arabic",
    "knowledge", "memory", "learning",
    "agents", "skills", "workflows",
    "models", "models.providers",
    "tools", "tools.built_in",
    "evaluation", "evaluation.benchmarks",
    "governance", "security",
    "api", "cli", "config",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
